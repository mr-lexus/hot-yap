name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test frontend lifecycle helpers
        run: pnpm test
      - name: Build desktop frontend
        run: pnpm build
      - name: Build landing
        run: pnpm site:build

  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Check Python sources
        run: python -m compileall -q backend
      - name: Install Python test dependencies
        run: python -m pip install "av>=14,<19" "numpy>=1.26,<3"
      - name: Test worker protocol
        run: python -m unittest discover -s backend/tests -p 'test_*.py' -v

  apple-silicon-worker:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-release.txt
      - name: Install release worker dependencies
        run: python -m pip install --requirement backend/requirements-release.txt
      - name: Run worker tests
        run: python -m unittest discover -s backend/tests -p 'test_*.py' -v
      - name: Verify MLX runtime through the worker protocol
        shell: bash
        run: |
          printf '%s\n' \
            '{"id":1,"command":"verify_mlx_runtime","device":"cpu"}' \
            '{"id":2,"command":"shutdown"}' \
            | python backend/worker.py > mlx-smoke.jsonl
          python - <<'PY'
          import json
          import pathlib

          replies = {}
          for line in pathlib.Path("mlx-smoke.jsonl").read_text(encoding="utf-8").splitlines():
              payload = json.loads(line)
              if "id" in payload:
                  replies[payload["id"]] = payload
          mlx = replies.get(1, {})
          if not mlx.get("ok") or not mlx.get("available"):
              raise SystemExit(f"MLX runtime verification failed: {mlx}")
          if mlx.get("device") != "cpu":
              raise SystemExit(f"MLX runtime used the wrong smoke-test device: {mlx}")
          if replies.get(2, {}).get("event") != "shutdown_ack":
              raise SystemExit(f"worker shutdown verification failed: {replies}")
          PY
