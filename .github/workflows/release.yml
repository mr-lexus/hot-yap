name: Build alpha release

on:
  push:
    tags:
      - "v*-alpha.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Alpha tag to create, for example v0.1.0-alpha.1"
        required: true
        default: "v0.1.0-alpha.1"

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            label: Linux x86_64
          - platform: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
            label: Windows x86_64
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            label: macOS Intel
          - platform: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
            label: macOS Apple Silicon

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-release.txt

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set Apple Silicon deployment target
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install worker build dependencies
        run: python -m pip install --requirement backend/requirements-release.txt

      - name: Build bundled worker (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          extra_collect=()
          if [[ "${{ matrix.target }}" == "aarch64-apple-darwin" ]]; then
            extra_collect+=(--collect-all mlx --collect-all mlx_whisper)
          fi
          python -m PyInstaller \
            --noconfirm --clean --onefile \
            --name hotyap-worker \
            --paths backend \
            --hidden-import inference \
            --hidden-import media \
            --hidden-import model_download \
            --collect-all av \
            --collect-all faster_whisper \
            --collect-all ctranslate2 \
            --collect-all tokenizers \
            --collect-all huggingface_hub \
            --collect-all onnxruntime \
            "${extra_collect[@]}" \
            --distpath build/worker \
            --workpath build/pyinstaller \
            --specpath build \
            backend/worker.py
          mkdir -p src-tauri/binaries
          mv build/worker/hotyap-worker "src-tauri/binaries/hotyap-worker-${{ matrix.target }}"
          chmod +x "src-tauri/binaries/hotyap-worker-${{ matrix.target }}"

      - name: Build bundled worker (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm --clean --onefile `
            --name hotyap-worker `
            --paths backend `
            --hidden-import inference `
            --hidden-import media `
            --hidden-import model_download `
            --collect-all av `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all tokenizers `
            --collect-all huggingface_hub `
            --collect-all onnxruntime `
            --distpath build/worker `
            --workpath build/pyinstaller `
            --specpath build `
            backend/worker.py
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Move-Item build/worker/hotyap-worker.exe "src-tauri/binaries/hotyap-worker-${{ matrix.target }}.exe"

      - name: Smoke-test bundled worker (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p build/worker-smoke
          {
            printf '%s\n' '{"id":1,"command":"status","model_dir":"build/worker-smoke","catalog":[]}'
            if [[ "$TARGET" == "aarch64-apple-darwin" ]]; then
              printf '%s\n' '{"id":2,"command":"verify_mlx_runtime","device":"cpu"}'
              printf '%s\n' '{"id":3,"command":"shutdown"}'
            else
              printf '%s\n' '{"id":2,"command":"shutdown"}'
            fi
          } | "src-tauri/binaries/hotyap-worker-${{ matrix.target }}" | tee build/worker-smoke/output.jsonl
          python - "build/worker-smoke/output.jsonl" "$TARGET" <<'PY'
          import json
          import pathlib
          import sys

          replies = {}
          for line in pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines():
              try:
                  payload = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if "id" in payload:
                  replies[payload["id"]] = payload
          if not replies.get(1, {}).get("ok"):
              raise SystemExit(f"worker status smoke test failed: {replies}")
          if sys.argv[2] == "aarch64-apple-darwin":
              mlx = replies.get(2, {})
              if not mlx.get("ok") or not mlx.get("available"):
                  raise SystemExit(f"MLX runtime smoke test failed: {mlx}")
              if mlx.get("device") != "cpu":
                  raise SystemExit(f"MLX runtime used the wrong smoke-test device: {mlx}")
          shutdown_id = 3 if sys.argv[2] == "aarch64-apple-darwin" else 2
          if replies.get(shutdown_id, {}).get("event") != "shutdown_ack":
              raise SystemExit(f"worker shutdown smoke test failed: {replies}")
          PY

      - name: Smoke-test bundled worker (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/worker-smoke | Out-Null
          $output = '{"id":1,"command":"download_cuda_runtime","models_root":"build/worker-smoke"}', '{"id":2,"command":"verify_cuda_runtime","models_root":"build/worker-smoke"}', '{"id":3,"command":"verify_vad"}', '{"id":4,"command":"shutdown"}' |
            & "src-tauri/binaries/hotyap-worker-${{ matrix.target }}.exe" 2>&1
          function Get-Reply([int]$id) {
            $output | ForEach-Object { try { $_ | ConvertFrom-Json } catch {} } |
              Where-Object { $_.id -eq $id } | Select-Object -Last 1
          }
          # The worker's stderr is captured into $output, so it must be
          # printed explicitly or a failed smoke test hides its diagnostics.
          function Show-WorkerOutput {
            Write-Output "---- bundled worker output (stdout+stderr) ----"
            $output | ForEach-Object { Write-Output $_ }
            Write-Output "-----------------------------------------------"
          }
          $dl = Get-Reply 1
          if (-not $dl.ok) {
            Show-WorkerOutput
            Write-Error "CUDA runtime download failed: $($dl.error)"
            exit 1
          }
          $resp = Get-Reply 2
          if (-not $resp.ok -or -not $resp.runtime_ok) {
            Show-WorkerOutput
            Write-Error "CUDA runtime verification failed: dlls=$($resp.dlls | ConvertTo-Json -Compress) error=$($resp.error)"
            exit 1
          }
          Write-Host "CUDA runtime verified: $($resp.dlls | ConvertTo-Json -Compress)"
          $vad = Get-Reply 3
          if (-not $vad.ok -or -not $vad.session_ok) {
            Show-WorkerOutput
            Write-Error "VAD/onnxruntime verification failed: error=$($vad.error)"
            exit 1
          }
          Write-Host "VAD/onnxruntime verified: onnxruntime=$($vad.onnxruntime_version)"

      - name: Remove worker build intermediates (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: rm -rf build/pyinstaller build/worker

      - name: Remove worker build intermediates (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item -Recurse -Force build/pyinstaller, build/worker

      - name: Compute worker checksum (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          HASH=$(python -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "src-tauri/binaries/hotyap-worker-${{ matrix.target }}")
          echo "WORKER_SHA256=$HASH" >> "$GITHUB_ENV"

      - name: Compute worker checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash "src-tauri/binaries/hotyap-worker-${{ matrix.target }}.exe" -Algorithm SHA256).Hash.ToLower()
          echo "WORKER_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build installers and publish prerelease
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOTYAP_RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          HOTYAP_RELEASE_REPO: ${{ github.repository }}
          HOTYAP_WORKER_SHA256: ${{ env.WORKER_SHA256 }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "HotYap ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            HotYap alpha: local RU/EN dictation, optional text-only history, audio/video file transcription, and native MLX/Metal models for Apple Silicon.

            The local transcription engine is downloaded automatically on first use, and speech models are downloaded separately. These builds are currently unsigned; operating-system warnings are expected.

            Linux: DEB, RPM, AppImage. Windows: MSI, NSIS. macOS: DMG for Intel and Apple Silicon.
          releaseDraft: true
          prerelease: true
          args: --config src-tauri/tauri.release.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Upload worker sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$env:TAG" "src-tauri/binaries/hotyap-worker-${{ matrix.target }}.exe" --clobber

      - name: Upload worker sidecar (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" "src-tauri/binaries/hotyap-worker-${{ matrix.target }}" --clobber
