[package]
name = "hotyap"
version = "0.1.0"
description = "HotYap local RU/EN voice dictation app for Linux"
authors = ["HotYap"]
edition = "2021"

[lib]
name = "hotyap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
cpal = "0.16"
hound = "3.5"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "query", "rustls"] }
tokio = { version = "1", features = ["sync", "time", "process", "io-util", "macros", "fs"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
